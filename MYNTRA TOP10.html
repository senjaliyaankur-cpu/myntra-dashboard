const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(CT));
  return new TextDecoder().decode(pt);
}
function show(html){window.ONLINE=true;document.open();document.write(html);document.close();}
async function open_(pw,remember){
  try{ const html=await dec(pw);
    try{sessionStorage.setItem('mpw',pw);if(remember)localStorage.setItem('mpw',pw);}catch(e){}
    show(html); return true;
  }catch(e){ return false; }
}
const err=document.getElementById('err');
document.getElementById('go').onclick=async()=>{
  err.textContent='Khul raha hai...';
  if(!await open_(document.getElementById('pw').value,document.getElementById('rm').checked)) err.textContent='Password galat hai.';
};
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click();});
(async()=>{let p=null;try{p=sessionStorage.getItem('mpw')||localStorage.getItem('mpw');}catch(e){}
  if(p&&!await open_(p,false)){try{sessionStorage.removeItem('mpw');localStorage.removeItem('mpw');}catch(e){}}})();
